name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Test with coverage
        run: ./gradlew test koverXmlReport
      - name: Verify coverage
        run: ./gradlew koverVerify
