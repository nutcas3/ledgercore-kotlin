spring:
  application:
    name: ledgercore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgercore}
    username: ${DB_USERNAME:ledgercore}
    password: ${DB_PASSWORD:ledgercore}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ledgercore:
  hmac-secret: ${LEDGERCORE_HMAC_SECRET:dev-only-secret-change-me}
